<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форум читателей - Комментарии</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>

    <!-- Подключение React и ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <!-- Babel для JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Основной код приложения (встроенный) -->
    <script type="text/babel">
        // Эмуляция API - имитация загрузки существующих комментариев
        const fetchInitialComments = () => {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve([
                        {
                            id: 1,
                            author: "Алексей Петров",
                            text: "Очень интересная книга! Рекомендую всем любителям фантастики.",
                            notify: true,
                            date: new Date(Date.now() - 86400000 * 2).toISOString()
                        },
                        {
                            id: 2,
                            author: "Мария Иванова",
                            text: "Спасибо автору за глубокий сюжет. Жду продолжения!",
                            notify: false,
                            date: new Date(Date.now() - 86400000).toISOString()
                        },
                        {
                            id: 3,
                            author: "Дмитрий Смирнов",
                            text: "Отличная форма комментариев, очень удобно оставлять отзывы.",
                            notify: true,
                            date: new Date(Date.now() - 3600000 * 5).toISOString()
                        }
                    ]);
                }, 800);
            });
        };

        // Компонент уведомления
        const Notification = ({ message, type, onClose }) => {
            React.useEffect(() => {
                const timer = setTimeout(() => {
                    onClose();
                }, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`notification ${type}`}>
                    <span>{type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span>
                    <span>{message}</span>
                </div>
            );
        };

        // Основной компонент приложения
        const CommentForum = () => {
            const [author, setAuthor] = React.useState('');
            const [commentText, setCommentText] = React.useState('');
            const [notify, setNotify] = React.useState(false);
            const [comments, setComments] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [notification, setNotification] = React.useState(null);
            const [errors, setErrors] = React.useState({ author: false, text: false });

            // Жизненный цикл - загрузка комментариев при монтировании компонента
            React.useEffect(() => {
                let isMounted = true;

                const loadComments = async () => {
                    setLoading(true);
                    try {
                        const initialComments = await fetchInitialComments();
                        if (isMounted) {
                            setComments(initialComments);
                            showNotificationMessage(`Загружено ${initialComments.length} комментариев`, 'info');
                        }
                    } catch (error) {
                        if (isMounted) {
                            showNotificationMessage('Ошибка загрузки комментариев', 'error');
                        }
                    } finally {
                        if (isMounted) {
                            setLoading(false);
                        }
                    }
                };

                loadComments();

                return () => {
                    isMounted = false;
                };
            }, []);

            const showNotificationMessage = (message, type = 'success') => {
                setNotification({ message, type });
            };

            const resetForm = () => {
                setAuthor('');
                setCommentText('');
                setNotify(false);
                setErrors({ author: false, text: false });
            };

            const handleSubmit = (e) => {
                e.preventDefault();

                const newErrors = {
                    author: author.trim() === '',
                    text: commentText.trim() === ''
                };

                setErrors(newErrors);

                if (newErrors.author || newErrors.text) {
                    showNotificationMessage('Пожалуйста, заполните все обязательные поля', 'error');
                    return;
                }

                const newComment = {
                    id: Date.now(),
                    author: author.trim(),
                    text: commentText.trim(),
                    notify: notify,
                    date: new Date().toISOString()
                };

                setComments(prevComments => [newComment, ...prevComments]);

                if (notify) {
                    showNotificationMessage(`Уведомление: Ваш комментарий опубликован, ${author}!`, 'success');
                } else {
                    showNotificationMessage('Комментарий успешно опубликован!', 'success');
                }

                resetForm();
            };

            const handleCancel = () => {
                if (author.trim() !== '' || commentText.trim() !== '') {
                    if (window.confirm('Вы уверены, что хотите очистить форму? Все несохраненные данные будут потеряны.')) {
                        resetForm();
                        showNotificationMessage('Форма очищена', 'info');
                    }
                } else {
                    resetForm();
                    showNotificationMessage('Форма очищена', 'info');
                }
            };

            const formatDate = (dateString) => {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const diffHours = Math.floor(diffTime / (1000 * 60 * 60));
                const diffMinutes = Math.floor(diffTime / (1000 * 60));

                if (diffMinutes < 1) return 'Только что';
                if (diffMinutes < 60) return `${diffMinutes} ${declensionMinutes(diffMinutes)} назад`;
                if (diffHours < 24) return `${diffHours} ${declensionHours(diffHours)} назад`;
                if (diffDays === 1) return 'Вчера';
                if (diffDays < 7) return `${diffDays} ${declensionDays(diffDays)} назад`;
                return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
            };

            const declensionMinutes = (n) => {
                if (n % 10 === 1 && n % 100 !== 11) return 'минуту';
                if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'минуты';
                return 'минут';
            };

            const declensionHours = (n) => {
                if (n % 10 === 1 && n % 100 !== 11) return 'час';
                if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'часа';
                return 'часов';
            };

            const declensionDays = (n) => {
                if (n % 10 === 1 && n % 100 !== 11) return 'день';
                if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'дня';
                return 'дней';
            };

            return (
                <div className="container">
                    <div className="comments-card">
                        <div className="card-header">
                            <h1>Форум читателей</h1>
                            <p>Обсуждаем книги, делимся впечатлениями и рекомендуем новинки 📚</p>
                        </div>

                        <div className="comments-list">
                            {loading ? (
                                <div className="empty-state" style={{ background: 'transparent' }}>
                                    Загрузка комментариев...
                                </div>
                            ) : comments.length === 0 ? (
                                <div className="empty-state">
                                    Пока нет комментариев. Будьте первым!
                                </div>
                            ) : (
                                comments.map(comment => (
                                    <div key={comment.id} className="comment-item">
                                        <div className="comment-header">
                                            <div className="comment-author">{comment.author}</div>
                                            {comment.notify && (
                                                <div className="comment-badge">
                                                    Уведомления включены
                                                </div>
                                            )}
                                        </div>
                                        <div className="comment-text">{comment.text}</div>
                                        <div className="comment-date">{formatDate(comment.date)}</div>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="form-section">
                            <form onSubmit={handleSubmit} noValidate>
                                <div className="form-group">
                                    <label className="required">Ваше имя</label>
                                    <input
                                        type="text"
                                        value={author}
                                        onChange={(e) => {
                                            setAuthor(e.target.value);
                                            if (errors.author && e.target.value.trim() !== '') {
                                                setErrors(prev => ({ ...prev, author: false }));
                                            }
                                        }}
                                        placeholder="Введите ваше имя"
                                        style={{ borderColor: errors.author ? '#e53e3e' : '#e2e8f0' }}
                                    />
                                    {errors.author && (
                                        <div style={{ color: '#e53e3e', fontSize: '0.75rem', marginTop: '5px' }}>
                                            Пожалуйста, укажите ваше имя
                                        </div>
                                    )}
                                </div>

                                <div className="form-group">
                                    <label className="required">Комментарий</label>
                                    <textarea
                                        value={commentText}
                                        onChange={(e) => {
                                            setCommentText(e.target.value);
                                            if (errors.text && e.target.value.trim() !== '') {
                                                setErrors(prev => ({ ...prev, text: false }));
                                            }
                                        }}
                                        placeholder="Поделитесь своим мнением о книге..."
                                        style={{ borderColor: errors.text ? '#e53e3e' : '#e2e8f0' }}
                                    />
                                    <div className={`char-counter ${commentText.length > 500 ? 'warning' : ''}`}>
                                        {commentText.length}/500 символов
                                    </div>
                                    {errors.text && (
                                        <div style={{ color: '#e53e3e', fontSize: '0.75rem', marginTop: '5px' }}>
                                            Введите текст комментария
                                        </div>
                                    )}
                                </div>

                                <div className="checkbox-group">
                                    <label>
                                        <input
                                            type="checkbox"
                                            checked={notify}
                                            onChange={(e) => setNotify(e.target.checked)}
                                        />
                                        <span>🔔 Получать уведомления о новых ответах</span>
                                    </label>
                                </div>

                                <div className="button-group">
                                    <button type="submit" className="btn btn-primary">
                                        📝 Опубликовать комментарий
                                    </button>
                                    <button type="button" className="btn btn-secondary" onClick={handleCancel}>
                                        🗑️ Очистить
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    {notification && (
                        <Notification
                            message={notification.message}
                            type={notification.type}
                            onClose={() => setNotification(null)}
                        />
                    )}
                </div>
            );
        };

        // Рендеринг приложения
        ReactDOM.createRoot(document.getElementById('root')).render(<CommentForum />);
    </script>
</body>
</html>
